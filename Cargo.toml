[package]
name = "msec"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Mobile app security analysis core for Android and iOS packages: a Rust port of the MobSF analysis engine (early development)"
license = "GPL-3.0-only"
repository = "https://github.com/marirs/msec"
readme = "README.md"
keywords = ["security", "android", "ios", "mobsf", "sast"]
categories = ["development-tools", "parser-implementations"]
exclude = [".github/"]

[dependencies]
crc32fast = "1.5.2"
der = { version = "0.8.2", features = ["derive", "oid"] }
dsa = "0.7.0"
ecdsa = { version = "0.17.0", features = ["der", "digest", "spki", "std"] }
flate2 = "1.1.10"
md-5 = "0.11.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
# Pinned exactly: the 0.10 line (digest 0.11, matching sha2 0.11) is still a release candidate.
rsa = { version = "=0.10.0-rc.19", default-features = false, features = ["std", "encoding"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
signature = "3.0.0"
spki = "0.8.1"
x509-cert = { version = "0.3.0", default-features = false }

[dev-dependencies]
# Independent writer for cross-checking the reader; pure-Rust deflate only.
crc32fast = "1.5.2"
flate2 = "1.1.10"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
